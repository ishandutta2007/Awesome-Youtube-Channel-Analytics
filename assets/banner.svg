<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#990000" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF4D4D" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.04); }
    }
    @keyframes chartFlow {
      0% { stroke-dashoffset: 600; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -600; }
    }
    @keyframes barRise1 {
      0%, 100% { height: 70px; y: 310px; }
      50% { height: 110px; y: 270px; }
    }
    @keyframes barRise2 {
      0%, 100% { height: 120px; y: 260px; }
      50% { height: 160px; y: 220px; }
    }
    @keyframes barRise3 {
      0%, 100% { height: 90px; y: 290px; }
      50% { height: 140px; y: 240px; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes borderSweep {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 2400; }
    }

    .ambient-glow {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 200, 400;
      animation: chartFlow 12s linear infinite;
    }
    .bar-anim-1 { animation: barRise1 4s ease-in-out infinite; }
    .bar-anim-2 { animation: barRise2 5s ease-in-out infinite 0.5s; }
    .bar-anim-3 { animation: barRise3 4.5s ease-in-out infinite 1s; }
    .floating-card-1 { animation: floatCard1 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard2 6s ease-in-out infinite 0.7s; }
    .border-runner {
      stroke-dasharray: 400 800;
      animation: borderSweep 20s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .metric-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGradient)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.12">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300 M 0 360 L 1200 360" stroke="#94a3b8" stroke-width="1" />
    <path d="M 120 0 L 120 420 M 240 0 L 240 420 M 360 0 L 360 420 M 480 0 L 480 420 M 600 0 L 600 420 M 720 0 L 720 420 M 840 0 L 840 420 M 960 0 L 960 420 M 1080 0 L 1080 420" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Ambient Glow Spheres (Subtle Background) -->
  <circle cx="200" cy="120" r="140" fill="url(#redGlow)" class="ambient-glow" filter="url(#glow)" />
  <circle cx="1020" cy="300" r="160" fill="#38bdf8" opacity="0.08" class="ambient-glow" filter="url(#glow)" />
  <circle cx="950" cy="90" r="110" fill="#818cf8" opacity="0.07" class="ambient-glow" filter="url(#glow)" />

  <!-- Animated Analytics Wave / Graph in Background -->
  <g opacity="0.25">
    <path d="M 0 350 Q 200 310 380 340 T 750 280 T 1050 210 T 1200 230" fill="none" stroke="#38bdf8" stroke-width="3" class="flow-line" filter="url(#glow)" />
    <path d="M 0 380 Q 250 330 450 360 T 820 290 T 1100 250 T 1200 270" fill="none" stroke="#FF0000" stroke-width="2" class="flow-line" />
  </g>

  <!-- Animated Bar Chart Graphics (Flanked at bottom right) -->
  <g opacity="0.35" transform="translate(920, 0)">
    <rect x="0" y="310" width="22" height="70" rx="6" fill="url(#barGrad1)" class="bar-anim-1" />
    <rect x="32" y="260" width="22" height="120" rx="6" fill="url(#barGrad2)" class="bar-anim-2" />
    <rect x="64" y="290" width="22" height="90" rx="6" fill="url(#barGrad3)" class="bar-anim-3" />
    <rect x="96" y="240" width="22" height="140" rx="6" fill="url(#barGrad1)" class="bar-anim-2" />
    <rect x="128" y="220" width="22" height="160" rx="6" fill="url(#barGrad2)" class="bar-anim-1" />
    <rect x="160" y="270" width="22" height="110" rx="6" fill="url(#barGrad3)" class="bar-anim-3" />
  </g>

  <!-- Subtle Floating Decorative Pill: Top Left -->
  <g class="floating-card-1" opacity="0.85">
    <rect x="70" y="45" width="210" height="42" rx="21" fill="url(#cardBg)" stroke="#FF0000" stroke-width="1.2" stroke-opacity="0.4" filter="url(#softShadow)" />
    <circle cx="92" cy="66" r="7" fill="#FF0000" />
    <text x="110" y="72" fill="#f8fafc" font-size="13" class="metric-text">LIVE METRICS ENGINE</text>
  </g>

  <!-- Subtle Floating Metric Pill: Bottom Left -->
  <g class="floating-card-2" opacity="0.85">
    <rect x="70" y="335" width="260" height="48" rx="24" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" filter="url(#softShadow)" />
    <!-- YouTube Play Icon Mini -->
    <rect x="88" y="349" width="26" height="20" rx="5" fill="#FF0000" />
    <polygon points="98,354 107,359 98,364" fill="#ffffff" />
    <text x="124" y="365" fill="#38bdf8" font-size="15" class="metric-text">+184% Outlier Reach</text>
  </g>

  <!-- Subtle Floating Metric Pill: Top Right -->
  <g class="floating-card-2" opacity="0.85">
    <rect x="910" y="45" width="220" height="42" rx="21" fill="url(#cardBg)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" filter="url(#softShadow)" />
    <circle cx="932" cy="66" r="7" fill="#34d399" />
    <text x="950" y="72" fill="#34d399" font-size="13" class="metric-text">CTR &amp; RETENTION TRACKER</text>
  </g>

  <!-- Central Foreground Content - High Contrast & Crisp -->
  <g filter="url(#softShadow)" transform="translate(600, 165)">
    <!-- YouTube Play Badge Large Center-Top -->
    <g transform="translate(-45, -55)">
      <rect x="0" y="0" width="90" height="60" rx="18" fill="#FF0000" filter="url(#glow)" />
      <polygon points="36,18 62,30 36,42" fill="#ffffff" />
    </g>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-size="44" text-anchor="middle" class="title-text">
      Awesome YouTube Channel Analytics
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="94" fill="#94a3b8" font-size="19" text-anchor="middle" class="sub-text">
      Curated Ecosystem of SaaS Intelligence Platforms &amp; Open-Source Pipelines
    </text>

    <!-- Keyword Badge Pill List -->
    <g transform="translate(0, 126)">
      <!-- Pill 1: Competitor Intelligence -->
      <g transform="translate(-320, 0)">
        <rect x="0" y="0" width="180" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="90" y="20" fill="#cbd5e1" font-size="12" text-anchor="middle" class="sub-text">🎯 Competitor Intelligence</text>
      </g>
      <!-- Pill 2: Outlier Video Discovery -->
      <g transform="translate(-125, 0)">
        <rect x="0" y="0" width="170" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="85" y="20" fill="#cbd5e1" font-size="12" text-anchor="middle" class="sub-text">⚡ Outlier Detection</text>
      </g>
      <!-- Pill 3: YouTube Data API -->
      <g transform="translate(60, 0)">
        <rect x="0" y="0" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="75" y="20" fill="#cbd5e1" font-size="12" text-anchor="middle" class="sub-text">📊 YouTube API v3</text>
      </g>
      <!-- Pill 4: Creator Economy -->
      <g transform="translate(225, 0)">
        <rect x="0" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="72" y="20" fill="#cbd5e1" font-size="12" text-anchor="middle" class="sub-text">🚀 Creator Tools</text>
      </g>
    </g>
  </g>

  <!-- Glowing Dynamic Border Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="19" fill="none" stroke="url(#cyanGlow)" stroke-width="2" class="border-runner" opacity="0.6" />
  <rect x="1" y="1" width="1198" height="418" rx="20" fill="none" stroke="#334155" stroke-width="1" opacity="0.5" />
</svg>
